apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    signingConfigs {
        debug {
            storePassword 'password'
            keyAlias 'key0'
            keyPassword 'password'
            storeFile file('keystore/myplace.jks')
        }
        release {
            storePassword 'password'
            keyAlias 'key0'
            keyPassword 'password'
            storeFile file('keystore/myplace.jks')

        }
    }
    compileSdkVersion 32
    buildToolsVersion "29.0.2"
    viewBinding {
        enabled = true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId "com.dmss.burbankapp"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 53
        versionName "3.13"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk.abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        signingConfig signingConfigs.debug
        vectorDrawables.useSupportLibrary = true

    }


    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        applicationVariants.all{
            variant ->
                variant.outputs.each{
                    output->
                        project.ext { appName = 'Burbank' }
                        def formattedDate = new Date().format('ddMMM')
                        def newName = output.outputFile.name
                        newName = newName.replace("app-", "$project.ext.appName-")
                        newName = newName.replace("-debug", "(V${variant.versionName})_"+ formattedDate)
                        output.outputFileName  = newName
                }
        }
    }

    compileOptions {
        sourceCompatibility = "1.8"
        targetCompatibility = "1.8"
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }

}
